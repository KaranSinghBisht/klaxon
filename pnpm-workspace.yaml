packages:
  - packages/*
  - demo/collector
  # demo/worm is deliberately NOT a workspace package: its postinstall is the attack.

# @ledgerhq/ledger-key-ring-protocol -> @ledgerhq/speculos-transport -> @ledgerhq/live-dmk-speculos,
# which is not published to npm. It is a device-emulator transport, unused by restoreTrustchain.
overrides:
  "@ledgerhq/live-dmk-speculos": "link:./stubs/empty"

# Build scripts (pnpm 11 fails a strict install on any unlisted postinstall).
# protobufjs's postinstall is skipped on purpose: the Hedera SDKs work without it and
# every install-time script is one more thing a lockfile can smuggle in.
# esbuild's postinstall only fetches its platform binary; it backs tsup and the action bundle.
allowBuilds:
  esbuild: true
  protobufjs: false
