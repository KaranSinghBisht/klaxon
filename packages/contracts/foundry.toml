[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Metadata hash is left at the default (ipfs) on purpose: Sourcify needs the embedded
# metadata CBOR to report a full match, and D13 requires Sourcify + Basescan verification.

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
base = {key = "${ETHERSCAN_API_KEY}", chain = 8453}
