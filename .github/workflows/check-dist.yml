name: check-dist

# GitHub does not install dependencies for JS actions, so `packages/action/dist/` is committed.
# This job rebuilds it and fails if what is committed differs from what the sources produce.

on:
  push:
    branches: [main]
    paths:
      - 'packages/action/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/check-dist.yml'
  pull_request:
    paths:
      - 'packages/action/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/check-dist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The action bundle inlines `@klaxon/core` from its built `dist/`, so core goes first.
      - run: pnpm --filter @klaxon/core build
      - run: pnpm --filter @klaxon/action build

      - name: Fail if the committed dist/ is stale
        run: |
          if ! git diff --exit-code -- packages/action/dist/; then
            echo "::error::packages/action/dist/ is out of date. Run 'pnpm --filter @klaxon/action build' and commit the result."
            exit 1
          fi

      - name: Upload the rebuilt bundle when it differs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: packages/action/dist/
