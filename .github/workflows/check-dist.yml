name: check-dist

# GitHub does not install dependencies for JS actions, so `packages/action/dist/` is committed.
# This job rebuilds it and fails if what is committed differs from what the sources produce.

on:
  push:
    branches: [main]
    paths:
      - 'packages/action/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-dist.yml'
  pull_request:
    paths:
      - 'packages/action/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-dist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          # D9 — `action.yml` declares `using: 'node24'` and the bundle is built `--target=node24`,
          # so the job that proves the committed dist matches a rebuild has to run on the runtime
          # the dist actually executes under. Pinned here rather than in the repo-root
          # `.node-version` (which is 22, and which the rest of the tooling reads).
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The action bundle inlines `@klaxon/core` from its built `dist/`, so core goes first.
      - run: pnpm --filter @klaxon/core build
      - run: pnpm --filter @klaxon/action build

      - name: Fail if the committed dist/ is stale
        run: |
          if ! git diff --exit-code -- packages/action/dist/; then
            echo "::error::packages/action/dist/ is out of date. Run 'pnpm --filter @klaxon/action build' and commit the result."
            exit 1
          fi

      # A matching dist only proves the bytes are current, not that Node 24 can load them. Both
      # entrypoints are CommonJS bundles that pull in `@x402/hedera`, `@actions/core` and the whole
      # of `@klaxon/core` at module scope, so requiring them here catches a module-format or
      # runtime break on the target runtime. Without this the first execution of the built action
      # would be during filming.
      #
      # `VITEST` suppresses the self-start guard at the bottom of each entrypoint: `GITHUB_ACTIONS`
      # is `true` in this job, and we want the module evaluated, not the action run.
      - name: Smoke-test the built entrypoints on Node 24
        env:
          VITEST: check-dist
        run: |
          node --version
          node -e "
            const entry = require('./packages/action/dist/index.js');
            const post = require('./packages/action/dist/post.js');
            if (typeof entry.main !== 'function') throw new Error('dist/index.js exports no main()');
            if (typeof post.post !== 'function') throw new Error('dist/post.js exports no post()');
            process.stdout.write('dist entrypoints load and export their entry functions\n');
          "

      - name: Upload the rebuilt bundle when it differs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: packages/action/dist/
